<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Quarkus Chess Arena - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .gradient-text {
            background: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow-btn {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }
        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 mb-4">
                <span class="text-5xl">♟️</span>
            </div>
            <h1 class="text-3xl font-bold gradient-text mb-2">Quarkus Chess Arena</h1>
            <p class="text-slate-400">Reactive PvP Chess Platform</p>
        </div>

        <!-- Auth Cards Container -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6">
            <!-- Tab Navigation -->
            <div class="flex gap-2 mb-6 bg-slate-900/50 p-1 rounded-xl">
                <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 px-4 py-3 rounded-lg text-sm font-semibold bg-slate-700 text-white transition-all">
                    🔑 Đăng nhập
                </button>
                <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 px-4 py-3 rounded-lg text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                    📝 Đăng ký
                </button>
            </div>

            <!-- Login Form -->
            <div id="contentLogin">
                <h2 class="text-xl font-bold text-slate-200 mb-6">Đăng nhập tài khoản</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Email</label>
                        <input type="email" id="loginEmail"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Mật khẩu</label>
                        <input type="password" id="loginPassword"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-all">
                    </div>
                    <button onclick="login()"
                            class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold py-3.5 px-6 rounded-xl glow-btn transition-all transform active:scale-95">
                        Đăng nhập
                    </button>
                    <p id="loginStatus" class="text-sm text-center"></p>
                </div>
            </div>

            <!-- Register Form -->
            <div id="contentRegister" class="hidden">
                <h2 class="text-xl font-bold text-slate-200 mb-6">Tạo tài khoản mới</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Email</label>
                        <input type="email" id="registerEmail"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Mật khẩu (ít nhất 8 ký tự)</label>
                        <input type="password" id="registerPassword"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Tên người dùng</label>
                        <input type="text" id="registerUsername"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-all">
                    </div>
                    <button onclick="register()"
                            class="w-full bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-bold py-3.5 px-6 rounded-xl glow-btn transition-all transform active:scale-95">
                        Đăng ký
                    </button>
                    <p id="registerStatus" class="text-sm text-center"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let authToken = localStorage.getItem('chessAuthToken') || null;

        // --- Auth Functions ---
        function switchAuthTab(tab) {
            // Hide all auth content
            document.getElementById('contentRegister').classList.add('hidden');
            document.getElementById('contentLogin').classList.add('hidden');
            // Remove active class
            document.getElementById('tabRegister').classList.remove('bg-slate-700', 'text-white');
            document.getElementById('tabRegister').classList.add('text-slate-400', 'hover:text-white', 'hover:bg-slate-800');
            document.getElementById('tabLogin').classList.remove('bg-slate-700', 'text-white');
            document.getElementById('tabLogin').classList.add('text-slate-400', 'hover:text-white', 'hover:bg-slate-800');
            // Show selected
            document.getElementById(`content${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('hidden');
            document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('bg-slate-700', 'text-white');
            document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-slate-800');
        }

        async function register() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const username = document.getElementById('registerUsername').value;
            const statusEl = document.getElementById('registerStatus');
            statusEl.className = 'text-sm text-center text-amber-400';
            statusEl.textContent = 'Đang đăng ký...';

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username })
                });

                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }

                statusEl.className = 'text-sm text-center text-emerald-400';
                statusEl.textContent = 'Đăng ký thành công! Hãy đăng nhập!';
                switchAuthTab('login');
            } catch (err) {
                statusEl.className = 'text-sm text-center text-red-400';
                statusEl.textContent = 'Lỗi: ' + err.message;
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const statusEl = document.getElementById('loginStatus');
            statusEl.className = 'text-sm text-center text-amber-400';
            statusEl.textContent = 'Đang đăng nhập...';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }

                const data = await res.json();
                authToken = data.token;
                localStorage.setItem('chessAuthToken', authToken);

                statusEl.className = 'text-sm text-center text-emerald-400';
                statusEl.textContent = 'Đăng nhập thành công! Chuyển hướng...';
                setTimeout(() => window.location.href = '/game.html', 1000);
            } catch (err) {
                statusEl.className = 'text-sm text-center text-red-400';
                statusEl.textContent = 'Lỗi: ' + err.message;
            }
        }

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async function() {
            if (authToken) {
                try {
                    const res = await fetch('/auth/me', {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    if (res.ok) {
                        window.location.href = '/game.html';
                    }
                } catch (e) {}
            }
        });
    </script>
</body>
</html>
